<style>
:root{color-scheme:light;--input:#fff;--inline:#d6deea;
  --bg:#f3f6fb;--card:#fff;--text:#1b2240;--muted:#667085;--line:#e3e8f1;
  --brand:#2d5fff;--brand-2:#e9eeff;--teal:#27d9bf;--grad:linear-gradient(100deg,#27d9bf 0%,#2a9ede 50%,#2d5fff 100%);--ok:#0f9b84;--ok-bg:#e3f9f4;--bad:#c2410c;--bad-bg:#fdeee5;
  --warn:#a16207;--warn-bg:#fdf6dd;--radius:14px;
}
:root[data-theme=dark]{color-scheme:dark;--input:#141a2b;--inline:#2c3550;
  --bg:#0f1424;--card:#1a2135;--text:#e8ecf6;--muted:#9aa4bd;--line:#273049;
  --brand:#5b82ff;--brand-2:#1f2a4d;--ok:#3ee0c6;--ok-bg:#123029;--bad:#fb923c;--bad-bg:#35210f;--warn:#facc15;--warn-bg:#2f2a10}
:root[data-theme=dark] .card{box-shadow:none}
#who .themebtn{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:50%;width:30px;height:30px;padding:0;font-size:15px;line-height:30px;text-align:center;cursor:pointer;margin-left:10px;text-decoration:none;opacity:1;vertical-align:middle}
#who{white-space:nowrap}
@media (max-width:420px){#vehSub{display:none}}

*{box-sizing:border-box}
body{margin:0;font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.4}
header{background:var(--grad);color:#fff;padding:14px 16px 0;box-shadow:0 4px 16px rgba(45,95,255,.18)}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
header:has(nav.hidden){padding-bottom:14px}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow img{height:38px;width:auto;display:block}
.brandrow .sep{width:1px;height:30px;background:rgba(255,255,255,.5)}
.authlogo{display:block;width:92px;margin:0 0 26px}
input,textarea,button{font-family:inherit}
.btn{box-shadow:0 2px 8px rgba(45,95,255,.25)}
.btn.sec{box-shadow:none}
header .sub{opacity:.85;font-size:14px}
nav{display:flex;margin-top:10px;overflow-x:auto}
nav button{flex:1 0 auto;background:none;border:0;color:#fff;opacity:.75;padding:10px 6px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.active{opacity:1;border-bottom-color:#fff}
nav .badge{color:var(--brand)!important}
nav .badge{background:#fff;color:var(--bad);border-radius:10px;padding:0 6px;font-size:12px;margin-left:3px}
main{max-width:640px;margin:0 auto;padding:18px 14px 40px}
input:focus,textarea:focus{outline:none;border-color:var(--brand)!important;box-shadow:0 0 0 3px rgba(45,95,255,.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,64,.04),0 6px 18px rgba(16,24,64,.05)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:5px 12px;border-radius:20px;width:fit-content}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.use{background:var(--warn-bg);color:var(--warn)}
.big{font-size:22px;font-weight:700;margin:8px 0 2px}
.muted{color:var(--muted);font-size:14px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:12px;padding:15px 18px;font-size:17px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;width:100%}
.btn.sec{background:var(--brand-2);color:var(--brand)}
.btn.small{width:auto;display:inline-flex;padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center}
.stat .v{font-size:21px;font-weight:700}
.stat .l{color:var(--muted);font-size:12px}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
label.f:first-child{margin-top:0}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=time],textarea{width:100%;padding:12px;border:1px solid var(--inline);border-radius:10px;font-size:16px;background:var(--input);color:var(--text);font-family:inherit}
textarea{min-height:60px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:12px 4px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:8px;text-align:left;padding:12px 10px;border-radius:10px;border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:650;font-size:14px;cursor:pointer;line-height:1.2}
.chip.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.chip .ic{font-size:16px;flex-shrink:0}
.probbox{margin-top:10px;background:var(--bad-bg);border-radius:10px;padding:10px}
.probbox .t{font-weight:700;color:var(--bad);font-size:14px;margin-bottom:6px}
.probbox textarea{background:var(--card)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:68px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.photo-add{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--brand);cursor:pointer;margin-top:8px}
.photo-add input{display:none}
.sectitle{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:18px 0 8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.use{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.blue{background:var(--brand-2);color:var(--brand)}
.hist{cursor:pointer}
.detail{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:14px}
.detail table{width:100%;border-collapse:collapse}
.detail td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.detail td:last-child{text-align:right}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px;font-weight:600}
.note{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.backlink{background:none;border:0;color:var(--brand);font-weight:700;font-size:15px;padding:0;margin-bottom:12px;cursor:pointer}
.res{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.res .hr{font-weight:700;min-width:96px;font-size:15px}
.res .who{flex:1;min-width:0}
.res .who div{overflow:hidden;text-overflow:ellipsis}
.daytitle{font-weight:700;font-size:15px;margin-bottom:4px;text-transform:capitalize}
.x{background:none;border:0;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;padding:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal img{max-width:100%;max-height:90vh;border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;font-size:15px;max-width:90vw;text-align:center}
.hidden{display:none!important}
.flex{display:flex;gap:10px;align-items:center}
#who button{background:none;border:0;color:#fff;text-decoration:underline;font-size:14px;cursor:pointer;padding:0 0 0 6px;opacity:.9}
.authwrap{max-width:460px;margin:0 auto;padding:7vh 0 24px}
body.auth{background:#0f1424}
body.auth header{display:none}
.authcard{border-radius:20px;padding:36px 40px;border:0;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.authcard h2{margin:0 0 6px;font-size:24px;font-weight:700;color:var(--text)}
.authcard .lead{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.55}
.authcard label.f{margin-top:16px}
.authcard input{background:var(--card)!important}
.authcard .btns{margin-top:22px}
.authlinks{display:flex;gap:24px;flex-wrap:wrap;margin-top:28px}
.authlinks button{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;font-size:15px;cursor:pointer}
@media (max-width:480px){.authcard{padding:28px 22px}.authwrap{padding-top:4vh}}
.link{background:none;border:0;color:var(--brand);font-weight:700;font-size:15px;cursor:pointer;padding:8px;width:100%}
.urow{padding:12px 0;border-top:1px solid var(--line)}
.urow:first-of-type{border-top:0}
</style>
</head>

<script>
// ===== CONFIGURAÇÃO DO FIREBASE (mesmo projeto da Migração de Torres) =====
const firebaseConfig = {
  apiKey: "AIzaSyA3syopd6VCE35PWsuFp-HeuLD64iPRISg",
  authDomain: "painel-de-migracao.firebaseapp.com",
  projectId: "painel-de-migracao",
  storageBucket: "painel-de-migracao.firebasestorage.app",
  messagingSenderId: "1094396721358",
  appId: "1:1094396721358:web:a30a0dcc6f4b3d60ad389f"
};
// E-mails que já entram como administradores (dono da plataforma)
const DONOS = ["fernando.gustavo@souuni.com"];
// ==========================================================================
firebase.initializeApp(firebaseConfig);
const fbAuth=firebase.auth();
const fs=firebase.firestore();
fbAuth.languageCode="pt";
function getTheme(){try{return localStorage.getItem("mobi_tema")||"light"}catch(e){return"light"}}
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("mobi_tema",t)}catch(e){}
  const m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute("content",t==="dark"?"#0f1424":"#2d5fff")}
applyTheme(getTheme());
// Checklist rápido de saída: tudo começa como OK; toque só no que tiver problema.
const ITEMS = [
  ["pneus","Pneus e estepe"],
  ["luzes","Faróis, setas e freio"],
  ["lataria","Lataria sem avaria nova"],
  ["vidros","Vidros e retrovisores"],
  ["painel","Painel sem alerta"],
  ["oleo","Óleo e água"],
  ["documento","Documento (CRLV)"],
  ["limpeza","Limpeza interna"]
];
const LABELS = Object.fromEntries([...ITEMS,["uso","Problema durante o uso"]]);
const FUEL = ["Reserva","1/4","1/2","3/4","Cheio"];

let user=null, myId=null, myName="", canEditCfg=false;
let trips=[], reservas=[], vehicle={}, loaded=false, loadTimer=null, stale=false;
let tab="status", view=null, openHist=null, histQ="";
let agendaForm=null; // {data,ini,fim,motivo,nome,err,saving}
let sess=null, usuarios=[];
// banco: todas as coleções do Mobi ficam com o prefixo mobi_
const db={collection:n=>fs.collection("mobi_"+n),doc:p=>fs.doc("mobi_"+p)};
// fotos: comprimidas e guardadas no próprio banco (coleção mobi_fotos)
const fotoCache={};
const assets={upload:async blob=>{
  let data=await blobToDataUrl(blob);
  if(data.length>900000){data=await shrinkDataUrl(data,800,0.6)}
  const ref=fs.collection("mobi_fotos").doc();
  await ref.set({data,por:myId||null,criadoEm:new Date().toISOString()});
  fotoCache[ref.id]=data;return{id:ref.id};
}};
function blobToDataUrl(b){return new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b)})}
function shrinkDataUrl(u,max,q){return new Promise(r=>{const i=new Image();i.onload=()=>{const sc=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement("canvas");c.width=Math.round(i.width*sc);c.height=Math.round(i.height*sc);c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",q))};i.src=u})}
const PIXEL="data:image/gif;base64,R0lGODlhAQABAAAAACw=";
const fotoLoading={};
function hydratePhotos(){
  document.querySelectorAll("img[data-img]").forEach(img=>{
    const id=img.dataset.img;
    if(fotoCache[id]){if(img.src!==fotoCache[id])img.src=fotoCache[id];return}
    if(fotoLoading[id])return;
    fotoLoading[id]=fs.collection("mobi_fotos").doc(id).get().then(d=>{if(d.exists){fotoCache[id]=d.data().data;hydratePhotos()}}).catch(()=>{}).finally(()=>{delete fotoLoading[id]});
  });
}

function dayLabel(d){

const openTrip=()=>trips.find(t=>t.status==="em_uso");
function lastKm(){
  const base=typeof vehicle.kmAjuste==="number"?vehicle.kmAjuste:null,desde=vehicle.kmAjusteEm||"";
  let k=base;
  for(const t of trips)for(const ph of [t.saida,t.retorno]){
    if(!ph||typeof ph.km!=="number"||(desde&&String(ph.at)<=desde))continue;
    if(k==null||ph.km>k)k=ph.km;
  }
  return k;
}
function problemsOf(t){
  const out=[];
  for(const phase of ["saida","retorno"]){
    const p=t[phase];if(!p||!p.checklist)continue;
    for(const [key,c] of Object.entries(p.checklist)){
      if(c&&c.s==="problema")out.push({trip:t,phase,key,label:LABELS[key]||key,obs:c.obs||"",photos:c.photos||[],at:p.at,resolved:(t.resolvidos||{})[phase+"_"+key]});
    }
  }
  return out;
}
const allProblems=()=>trips.flatMap(problemsOf).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
const openProblems=()=>allProblems().filter(p=>!p.resolved);
const futureRes=()=>{const now=Date.now();return reservas.filter(r=>new Date(r.fim).getTime()>now).sort((a,b)=>a.inicio.localeCompare(b.inicio))};
const currentRes=()=>{const now=Date.now();return futureRes().find(r=>new Date(r.inicio).getTime()<=now)};
const canDelRes=r=>canEditCfg||(sess&&r.login===sess.login);

async function saveReserva(){
  const a=agendaForm;a.err="";
  const nome=a.nome.trim();
  const dFim=a.multi?a.dataFim:a.data;
  const ini=new Date(a.data+"T"+a.ini),fim=new Date(dFim+"T"+a.fim);
  if(!nome)a.err="Informe seu nome.";
  else if(!a.data||!dFim||!a.ini||!a.fim||isNaN(ini)||isNaN(fim))a.err="Preencha dias e horários.";
  else if(fim<=ini)a.err=a.multi?"A volta precisa ser depois da saída.":"O horário de volta precisa ser depois da saída.";
  else if(fim.getTime()<Date.now())a.err="Esse horário já passou.";
  else{
    const c=futureRes().find(r=>new Date(r.inicio)<fim&&new Date(r.fim)>ini);
    if(c)a.err=`Conflito: ${c.nome} já reservou de ${fmtDate(c.inicio)} até ${fmtDate(c.fim)}.`;
  }
  if(a.err){render();return}
  a.saving=true;render();
  try{
    await db.collection("reservas").doc().set({nome,login:sess?.login||null,uid:myId||null,inicio:ini.toISOString(),fim:fim.toISOString(),motivo:a.motivo.trim(),criadoEm:new Date().toISOString()});
    rememberName(nome);
    toast(a.multi?`Reservado: ${fmtDate(ini.toISOString())} → ${fmtDate(fim.toISOString())}`:`Reservado: ${dayLabel(ini)} ${hm(ini)}–${hm(fim)}`);
    newAgendaForm();if(tab!=="agenda")setTab("agenda");else render();
  }catch(e){a.saving=false;a.err=errMsg(e);render()}
}
function errMsg(e){
  return e?.code==="permission-denied"?"Você não tem permissão para isso. Fale com o administrador."
    :e?.code==="resource-exhausted"?"Limite do banco atingido. Avise o administrador."
    :"Não foi possível salvar. Verifique a conexão e tente de novo.";
}

function histCard(t){
  const probs=problemsOf(t).length;
  const km=t.status==="concluido"?Math.max(0,(t.retorno.km||0)-(t.saida.km||0)):null;
  const tag=t.status==="em_uso"?'<span class="tag use">Em uso</span>':probs?`<span class="tag bad">${probs} problema${probs>1?"s":""}</span>`:'<span class="tag ok">OK</span>';
  let h=`<div class="card hist" data-hist="${esc(t.id)}"><div class="top"><div><div style="font-weight:700">${esc(t.motorista)}</div>
    <div class="muted">${fmtDate(t.saida?.at)}${t.retorno?" → "+fmtDate(t.retorno.at):""}${km!=null?" · "+km.toLocaleString("pt-BR")+" km":""}</div></div>${tag}</div>`;
  if(openHist===t.id)h+=detail(t);
  return h+"</div>";
}
function phaseTable(p,label){
  if(!p)return"";
  let h=`<div style="font-weight:700;margin:8px 0 4px">${label} · ${fmtDate(p.at)}</div><table>
    <tr><td>Km</td><td>${fmtKm(p.km)}</td></tr><tr><td>Combustível</td><td>${esc(p.combustivel)}</td></tr>`;

    h+=`<tr><td>${esc(LABELS[k]||k)}${c.s==="problema"&&c.obs?`<div class="muted">${esc(c.obs)}</div>`:""}${photosHtml(c.photos)}</td>

    h+=`<div class="card"><div style="font-weight:700;margin-bottom:10px">Teve algum problema ou avaria?</div>
      <div class="seg"><button type="button" data-tp="0" class="${!v.teveProblema?"on":""}">Não, tudo certo</button><button type="button" data-tp="1" class="${v.teveProblema?"on":""}">Sim</button></div>
      ${v.teveProblema?`<div class="probbox"><textarea id="fUso" placeholder="Descreva o que aconteceu">${esc(v.usoObs)}</textarea>
        ${photosHtml(v.usoPhotos)}${assets?`<label class="photo-add">📷 Foto<input type="file" accept="image/*" capture="environment" data-photo="uso"></label>`:""}</div>`:""}
    </div>`;
  }
  h+=`<button class="btn" id="fSave" ${v.saving||v.uploading?"disabled":""}>${v.uploading?"Enviando foto…":v.saving?"Salvando…":saida?"Confirmar saída":"Confirmar devolução"}</button>`;

}
function bindForm(){
  const v=view;
  $("#fBack").onclick=()=>{view=null;render()};
  $("#fNome").oninput=e=>v.motorista=e.target.value;
  $("#fKm").oninput=e=>v.km=e.target.value;
  document.querySelectorAll("[data-fuel]").forEach(b=>b.onclick=()=>{v.combustivel=b.dataset.fuel;rerender()});
  document.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{const c=v.checklist[b.dataset.ck];c.s=c.s==="ok"?"problema":"ok";rerender()});
  document.querySelectorAll("[data-obs]").forEach(t=>t.oninput=()=>{v.checklist[t.dataset.obs].obs=t.value});
  document.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{v.teveProblema=b.dataset.tp==="1";rerender()});
  $("#fUso")&&($("#fUso").oninput=e=>v.usoObs=e.target.value);
  document.querySelectorAll("[data-photo]").forEach(inp=>inp.onchange=()=>uploadPhotos(inp.dataset.photo,[...inp.files]));
  document.querySelectorAll("[data-img]").forEach(i=>i.onclick=()=>showImg(i.dataset.img));
  $("#fSave").onclick=saveForm;
}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y)}

async function compress(file){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1400/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.8));
  }catch(e){return file}
}
async function uploadPhotos(key,files){
  const v=view;if(!assets||!files.length)return;
  v.uploading++;v.err="";rerender();
  try{for(const f of files){const r=await assets.upload(await compress(f));
    if(key==="uso")v.usoPhotos.push(r.id);else v.checklist[key].photos=[...(v.checklist[key].photos||[]),r.id]}}
  catch(e){v.err="Não foi possível enviar a foto. Tente de novo."}
  v.uploading--;if(view===v)rerender();
}

async function saveForm(){
  const v=view,o=openTrip(),saida=v.mode==="saida";
  v.err="";
  const nome=(v.motorista||"").trim(),km=Number(v.km),lk=lastKm();
  if(!nome)v.err="Informe seu nome.";
  else if(!v.km||isNaN(km)||km<0)v.err="Informe o km do painel.";
  else if(saida&&lk!=null&&km<lk)v.err=`O km não pode ser menor que o último registrado (${fmtKm(lk)}).`;
  else if(!saida&&o&&km<o.saida.km)v.err=`O km não pode ser menor que o da saída (${fmtKm(o.saida.km)}).`;
  else if(!v.combustivel)v.err="Toque no nível de combustível.";
  else if(saida){const s=ITEMS.filter(([k])=>v.checklist[k].s==="problema"&&!(v.checklist[k].obs||"").trim());if(s.length)v.err="Descreva o problema em: "+s.map(m=>m[1]).join(", ")}
  else if(v.teveProblema&&!v.usoObs.trim())v.err="Descreva o problema.";
  if(saida&&o)v.err="O carro já está com "+o.motorista+". É preciso registrar a devolução primeiro.";
  if(!saida&&!o)v.err="Não há saída em aberto.";
  if(v.err){render();window.scrollTo(0,0);return}
  const at=new Date().toISOString();
  let checklist={};
  if(saida)for(const [k] of ITEMS){const c=v.checklist[k];checklist[k]=c.s==="ok"?{s:"ok"}:{s:"problema",obs:c.obs.trim(),photos:c.photos||[]}}
  else checklist={uso:v.teveProblema?{s:"problema",obs:v.usoObs.trim(),photos:v.usoPhotos}:{s:"ok"}};
  const phase={at,km,combustivel:v.combustivel,checklist,por:myId||null,login:sess?.login||null,motorista:nome};
  v.saving=true;rerender();
  try{
    if(saida){await db.collection("trips").doc().set({motorista:nome,login:sess?.login||null,userId:myId||null,status:"em_uso",saida:phase,criadoEm:at});toast("Saída registrada. Boa viagem!")}
    else{await db.doc("trips/"+o.id).update({status:"concluido",retorno:phase});toast("Devolução registrada. Obrigado!")}
    rememberName(nome);
    view=null;tab="status";render();window.scrollTo(0,0);
  }catch(e){v.saving=false;v.err=errMsg(e);render();window.scrollTo(0,0)}
}

function fbErr(e){
  const c=e?.code||"";
  if(/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c))return"E-mail ou senha incorretos.";
  if(/email-already-in-use/.test(c))return"Esse e-mail já está cadastrado. Use \"Esqueci minha senha\" se não lembrar a senha.";
  if(/weak-password/.test(c))return"Senha fraca: use pelo menos 6 caracteres.";
  if(/invalid-email/.test(c))return"E-mail inválido.";
  if(/too-many-requests/.test(c))return"Muitas tentativas. Aguarde alguns minutos e tente de novo.";
  if(/network/.test(c))return"Sem conexão. Verifique a internet.";
  if(/permission-denied/.test(c))return"Sem permissão. Fale com o administrador.";
  return"Não foi possível concluir. Tente de novo.";
}

async function criarPerfil(nome,tel){
  await fs.collection("mobi_usuarios").doc(authUser.uid).set({nome,telefone:tel,email:authUser.email.toLowerCase(),
    status:isDono()?"ativo":"pendente",admin:isDono(),criadoEm:new Date().toISOString()});
}
const isDono=()=>!!authUser&&DONOS.includes(String(authUser.email).toLowerCase());
function bindAuth(){
  const a=auth;
  const to=m=>()=>{a.mode=m;a.err="";a.msg="";render()};
  $("#toCad")&&($("#toCad").onclick=to("cadastro"));
  $("#toEsq")&&($("#toEsq").onclick=to("esqueci"));
  $("#toLogin")&&($("#toLogin").onclick=to("login"));
  $("#doSair")&&($("#doSair").onclick=()=>{a.mode="login";a.err="";a.msg="";logout()});
  if($("#lGo")){
    $("#lUser").oninput=e=>a.login=e.target.value;
    const go=async()=>{
      a.err="";a.msg="";const l=normLogin(a.login),pw=$("#lPass").value;
      if(!l||!pw){a.err="Preencha e-mail e senha.";render();return}
      a.busy=true;render();
      try{await fbAuth.signInWithEmailAndPassword(l,pw)}catch(e){a.err=fbErr(e)}
      a.busy=false;render();
    };
    $("#lGo").onclick=go;$("#lPass").onkeydown=e=>{if(e.key==="Enter")go()};
  }
  if($("#eGo")){
    $("#eMail").oninput=e=>a.login=e.target.value;
    $("#eGo").onclick=async()=>{
      a.err="";const l=normLogin(a.login);
      if(!validLogin(l)){a.err="Informe um e-mail válido.";render();return}
      a.busy=true;render();
      try{await fbAuth.sendPasswordResetEmail(l);a.mode="login";a.msg="Se esse e-mail estiver cadastrado, você vai receber um link para criar uma senha nova. Veja também o spam."}
      catch(e){a.err=fbErr(e)}
      a.busy=false;render();
    };
  }
  if($("#cGo")){
    $("#cNomeU").oninput=e=>a.nome=e.target.value;$("#cTel").oninput=e=>a.tel=e.target.value;$("#cLogin").oninput=e=>a.login=e.target.value;
    $("#cGo").onclick=async()=>{
      a.err="";const l=normLogin(a.login),p1=$("#cPass").value,p2=$("#cPass2").value;
      if(a.nome.trim().length<3)a.err="Informe seu nome completo.";
      else if(!validLogin(l))a.err="Informe um e-mail válido.";
      else if(p1.length<6)a.err="A senha precisa ter pelo menos 6 caracteres.";
      else if(p1!==p2)a.err="As senhas não conferem.";
      if(a.err){render();return}
      a.busy=true;render();
      try{
        pendingNome={nome:a.nome.trim(),tel:a.tel.trim()};
        const cred=await fbAuth.createUserWithEmailAndPassword(l,p1);
        try{await cred.user.sendEmailVerification()}catch(e){}
      }catch(e){pendingNome=null;a.err=fbErr(e)}
      a.busy=false;render();
    };
  }
  if($("#vOk")){
    $("#vOk").onclick=async()=>{a.busy=true;a.err="";a.msg="";render();
      try{await authUser.reload();authUser=fbAuth.currentUser;if(authUser.emailVerified){await authUser.getIdToken(true);await onAuthReady()}else a.err="Ainda não aparece como confirmado. Clique no link do e-mail e tente de novo."}
      catch(e){a.err=fbErr(e)}
      a.busy=false;render()};
    $("#vRe").onclick=async()=>{a.busy=true;a.err="";render();
      try{await authUser.sendEmailVerification();a.msg="E-mail reenviado."}catch(e){a.err=fbErr(e)}
      a.busy=false;render()};
  }
  if($("#pGo")){
    $("#pNome").oninput=e=>a.nome=e.target.value;$("#pTel").oninput=e=>a.tel=e.target.value;
    $("#pGo").onclick=async()=>{
      if(a.nome.trim().length<3){a.err="Informe seu nome completo.";render();return}
      a.busy=true;render();
      try{await criarPerfil(a.nome.trim(),a.tel.trim())}catch(e){a.err=fbErr(e)}
      a.busy=false;render();
    };
  }
}
let pendingNome=null;

// ---------- usuários (admin) ----------
function renderUsers(){
  let h="";
  const pend=usuarios.filter(u=>u.status==="pendente"),outros=usuarios.filter(u=>u.status!=="pendente");
  if(pend.length){
    h+=`<div class="sectitle">Aguardando aprovação (${pend.length})</div><div class="card">`;
    for(const p of pend)h+=`<div class="urow"><div style="font-weight:700">${esc(p.nome)}</div>
      <div class="muted">${esc(p.email)}${p.telefone?" · "+esc(p.telefone):""} · ${fmtDate(p.criadoEm)}</div>
      <div class="flex" style="margin-top:8px"><button class="btn small" data-aprovar="${esc(p.id)}">Aprovar</button><button class="btn small sec" data-recusar="${esc(p.id)}">Recusar</button></div></div>`;
    h+='</div>';
  }
  h+=`<div class="sectitle">Usuários (${outros.length})</div>`;
  if(novoUser){
    const n=novoUser;
    h+=`<div class="card"><div style="font-weight:700;margin-bottom:8px">Novo usuário</div>${n.err?`<div class="err">${esc(n.err)}</div>`:""}
      <label class="f">Nome completo</label><input type="text" id="nNome" value="${esc(n.nome)}">
      <label class="f">Telefone</label><input type="text" id="nTel" value="${esc(n.tel)}">
      <label class="f">E-mail</label><input type="email" id="nLogin" value="${esc(n.login)}" autocapitalize="none">
      <label class="f">Senha inicial (mín. 6)</label><input type="text" id="nPass" value="${esc(n.senha)}">
      <div class="muted" style="margin-top:6px">A pessoa entra com esse e-mail e senha. Ela também recebe um link para confirmar o e-mail.</div>
      <div class="flex" style="margin-top:12px"><button class="btn small" id="nSave" ${n.busy?"disabled":""}>${n.busy?"Criando…":"Criar"}</button><button class="btn small sec" id="nCancel">Cancelar</button></div></div>`;
  }else h+=`<button class="btn sec" id="nOpen" style="margin-bottom:12px">+ Cadastrar usuário</button>`;
  if(outros.length){
    h+='<div class="card">';
    for(const u of [...outros].sort((a,b)=>String(a.nome).localeCompare(String(b.nome)))){
      const eu=u.id===myId;
      h+=`<div class="urow"><div class="top"><div><div style="font-weight:700">${esc(u.nome)}${eu?" (você)":""}</div><div class="muted">${esc(u.email)}${u.telefone?" · "+esc(u.telefone):""}</div></div>
        <div>${u.admin?'<span class="tag blue">Adm</span> ':""}${u.status==="ativo"?'<span class="tag ok">Ativo</span>':'<span class="tag bad">Bloqueado</span>'}</div></div>
        ${eu?"":`<div class="flex" style="margin-top:8px;flex-wrap:wrap">
        <button class="btn small sec" data-toggle="${esc(u.id)}">${u.status==="ativo"?"Bloquear":"Desbloquear"}</button>
        <button class="btn small sec" data-adm="${esc(u.id)}">${u.admin?"Tirar admin":"Tornar admin"}</button>
        <button class="btn small sec" data-reset="${esc(u.id)}">Enviar troca de senha</button></div>`}</div>`;
    }
    h+='</div>';
  }
  return h;
}
function bindUsers(){
  const upd=async(id,data,msg,b)=>{if(b)b.disabled=true;try{await fs.collection("mobi_usuarios").doc(id).update(data);msg&&toast(msg)}catch(e){if(b)b.disabled=false;toast(fbErr(e))}};
  document.querySelectorAll("[data-aprovar]").forEach(b=>b.onclick=()=>upd(b.dataset.aprovar,{status:"ativo"},"Acesso liberado",b));
  document.querySelectorAll("[data-recusar]").forEach(b=>b.onclick=()=>{
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirmar recusa?";return}
    upd(b.dataset.recusar,{status:"bloqueado"},"Pedido recusado",b)});
  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const u=usuarios.find(x=>x.id===b.dataset.toggle);upd(u.id,{status:u.status==="ativo"?"bloqueado":"ativo"},null,b)});
  document.querySelectorAll("[data-adm]").forEach(b=>b.onclick=()=>{const u=usuarios.find(x=>x.id===b.dataset.adm);upd(u.id,{admin:!u.admin},u.admin?"Não é mais administrador":"Agora é administrador",b)});
  document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async()=>{const u=usuarios.find(x=>x.id===b.dataset.reset);b.disabled=true;
    try{await fbAuth.sendPasswordResetEmail(u.email);toast("Link de nova senha enviado para "+u.email)}catch(e){toast(fbErr(e))}b.disabled=false});
  $("#nOpen")&&($("#nOpen").onclick=()=>{novoUser={nome:"",tel:"",login:"",senha:"",err:""};render()});
  if(novoUser&&$("#nSave")){
    const n=novoUser;
    $("#nNome").oninput=e=>n.nome=e.target.value;$("#nTel").oninput=e=>n.tel=e.target.value;
    $("#nLogin").oninput=e=>n.login=e.target.value;$("#nPass").oninput=e=>n.senha=e.target.value;
    $("#nCancel").onclick=()=>{novoUser=null;render()};
    $("#nSave").onclick=async()=>{
      n.err="";const l=normLogin(n.login);
      if(n.nome.trim().length<3)n.err="Informe o nome completo.";
      else if(!validLogin(l))n.err="Informe um e-mail válido.";
      else if(n.senha.length<6)n.err="Senha com pelo menos 6 caracteres.";
      if(n.err){render();return}
      n.busy=true;render();
      // cria a conta numa instância separada para não deslogar o administrador
      let sec=null;
      try{
        sec=firebase.apps.find(x=>x.name==="cadastro")||firebase.initializeApp(firebaseConfig,"cadastro");
        const sa=sec.auth();
        const cred=await sa.createUserWithEmailAndPassword(l,n.senha);
        try{await cred.user.sendEmailVerification()}catch(e){}
        await sec.firestore().collection("mobi_usuarios").doc(cred.user.uid).set({nome:n.nome.trim(),telefone:n.tel.trim(),email:l,status:"pendente",admin:false,criadoEm:new Date().toISOString()});
        await sa.signOut();
        await fs.collection("mobi_usuarios").doc(cred.user.uid).update({status:"ativo"});
        toast("Usuário criado: "+l);novoUser=null;
      }catch(e){n.err=fbErr(e)}
      n.busy=false;render();
    };
  }
}

// ---------- eventos ----------
function bindView(){
  if(tab==="usuarios")bindUsers();
  $("#goSai")&&($("#goSai").onclick=()=>newForm("saida"));
  $("#goRet")&&($("#goRet").onclick=()=>newForm("retorno"));
  $("#goRes")&&($("#goRes").onclick=()=>setTab("agenda"));
  $("#goProb")&&($("#goProb").onclick=()=>setTab("prob"));
  if(tab==="agenda"&&agendaForm){
    const a=agendaForm;
    $("#aNome").oninput=e=>a.nome=e.target.value;
    $("#aData").oninput=e=>{a.data=e.target.value;if(!a.multi||a.dataFim<a.data){a.dataFim=a.data;$("#aDataFim")&&($("#aDataFim").value=a.data)}};
    $("#aDataFim")&&($("#aDataFim").oninput=e=>a.dataFim=e.target.value);
    document.querySelectorAll("[data-multi]").forEach(b=>b.onclick=()=>{a.multi=b.dataset.multi==="1";if(!a.multi||a.dataFim<a.data)a.dataFim=a.data;render()});
    $("#aIni").oninput=e=>a.ini=e.target.value;
    $("#aFim").oninput=e=>a.fim=e.target.value;
    $("#aMot").oninput=e=>a.motivo=e.target.value;
    $("#aSave").onclick=saveReserva;
  }
  document.querySelectorAll("[data-delres]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirmar?";b.style.color="var(--bad)";return}
    try{await db.doc("reservas/"+b.dataset.delres).delete();toast("Reserva cancelada")}catch(e){toast("Não foi possível cancelar")}
  });
  document.querySelectorAll("[data-hist]").forEach(c=>c.onclick=e=>{
    if(e.target.closest("[data-img],[data-del]"))return;
    openHist=openHist===c.dataset.hist?null:c.dataset.hist;render()});
  document.querySelectorAll("[data-img]").forEach(i=>i.onclick=e=>{e.stopPropagation();showImg(i.dataset.img)});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Toque de novo para confirmar";return}
    try{await db.doc("trips/"+b.dataset.del).delete();toast("Registro excluído")}catch(err){toast("Não foi possível excluir")}
  });
  const q=$("#histQ");if(q)q.oninput=()=>{histQ=q.value;const p=q.selectionStart;render();const n=$("#histQ");n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll("[data-resolve]").forEach(b=>b.onclick=async()=>{
    const [id,key]=b.dataset.resolve.split("|");
    const obsEl=document.querySelector(`[data-resobs="${CSS.escape(b.dataset.resolve)}"]`);
    b.disabled=true;
    try{await db.doc("trips/"+id).update({resolvidos:{[key]:{at:new Date().toISOString(),obs:(obsEl?.value||"").trim(),por:myId||null}}});toast("Marcado como resolvido")}
    catch(e){b.disabled=false;toast("Não foi possível salvar")}
  });
  const cs=$("#cSave");if(cs)cs.onclick=async()=>{
    cs.disabled=true;
    try{await db.doc("config/vehicle").set({...vehicle,nome:$("#cNome").value.trim()||"Fiat Mobi",placa:$("#cPlaca").value.trim().toUpperCase()});toast("Salvo")}
    catch(e){toast("Não foi possível salvar")}
    cs.disabled=false;
  };
  const setKm=async v=>{
    if(openTrip()){toast("O carro está em uso. Ajuste depois da devolução.");return}
    try{await db.doc("config/vehicle").set({...vehicle,kmAjuste:v,kmAjusteEm:new Date().toISOString()});toast("Hodômetro ajustado para "+fmtKm(v))}
    catch(e){toast("Não foi possível salvar")}
  };
  $("#cKmSave")&&($("#cKmSave").onclick=()=>{const v=$("#cKm").value;if(v===""||isNaN(+v)||+v<0){toast("Informe um número válido");return}setKm(Math.round(+v))});
  $("#cKmZero")&&($("#cKmZero").onclick=e=>{const b=e.target;if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirmar zerar?";return}setKm(0)});
  $("#cWipe")&&($("#cWipe").onclick=async e=>{
    const b=e.target;if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tem certeza? Toque de novo para apagar tudo";return}
    b.disabled=true;b.textContent="Apagando…";
    try{for(const t of [...trips])await db.doc("trips/"+t.id).delete();for(const r of [...reservas])await db.doc("reservas/"+r.id).delete();toast("Histórico e reservas apagados")}
    catch(err){toast("Não foi possível apagar tudo")}
  });
}

// ---------- início ----------
function softRender(){
  // não atrapalha quem está digitando
  const ae=document.activeElement;
  if(view||(ae&&/INPUT|TEXTAREA/.test(ae.tagName)&&tab!=="hist")){updateBadge();return}
  render();
}
{const _render=render;render=function(){_render();try{hydratePhotos()}catch(e){}}}
(function(){
  render();
  function stopData(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];trips=[];reservas=[];usuarios=[];vehicle={};loaded=false;stale=false;clearTimeout(loadTimer)}
  function startData(){
    if(unsubs.length)return;
    let got={t:false,r:false};
    loadTimer=setTimeout(()=>{if(!loaded){stale=true;render()}},10000);
    const done=(k,s)=>{got[k]=true;if(got.t&&got.r){clearTimeout(loadTimer);stale=false}loaded=got.t;softRender()};
    const fail=e=>{console.error(e);clearTimeout(loadTimer);loaded=true;stale=true;render()};
    unsubs.push(db.collection("trips").orderBy("criadoEm","desc").limit(500).onSnapshot(s=>{trips=s.docs.map(d=>({id:d.id,...d.data()}));done("t",s)},fail));
    unsubs.push(db.collection("reservas").orderBy("inicio","desc").limit(300).onSnapshot(s=>{reservas=s.docs.map(d=>({id:d.id,...d.data()}));done("r",s)},fail));
    unsubs.push(db.doc("config/vehicle").onSnapshot(s=>{vehicle=s.exists?s.data():{};softRender()},()=>{}));
    if(canEditCfg)unsubs.push(fs.collection("mobi_usuarios").onSnapshot(s=>{usuarios=s.docs.map(d=>({id:d.id,...d.data()}));softRender()},()=>{}));
  }
  let perfilUnsub=null;
  window.onAuthReady=async function(){
    // ouve o próprio perfil: aprovação/bloqueio têm efeito na hora
    if(perfilUnsub){perfilUnsub();perfilUnsub=null}
    perfil=null;perfilLoaded=false;
    if(!authUser||!authUser.emailVerified){perfilLoaded=true;stopData();render();return}
    perfilUnsub=fs.collection("mobi_usuarios").doc(authUser.uid).onSnapshot(async s=>{
      perfil=s.exists?s.data():null;perfilLoaded=true;
      if(!perfil&&pendingNome){const p=pendingNome;pendingNome=null;try{await criarPerfil(p.nome,p.tel)}catch(e){auth.err=fbErr(e)}return}
      if(!perfil&&isDono()){try{await criarPerfil((authUser.displayName||authUser.email.split("@")[0]),"")}catch(e){}return}
      const wasAdmin=canEditCfg;
      canEditCfg=!!(perfil&&perfil.status==="ativo"&&perfil.admin);
      if(perfil&&perfil.status==="ativo"){
        myId=authUser.uid;sess={login:authUser.email.toLowerCase(),nome:perfil.nome||authUser.email};
        if(wasAdmin!==canEditCfg)stopData();
        startData();
      }else{sess=null;stopData()}
      render();
    },e=>{console.error(e);perfilLoaded=true;auth.err=fbErr(e);render()});
  };
  fbAuth.onAuthStateChanged(async u=>{
    authUser=u;
    if(!u){auth.mode="login";auth.busy=false;if(perfilUnsub){perfilUnsub();perfilUnsub=null}perfil=null;perfilLoaded=true;sess=null;myId=null;canEditCfg=false;stopData();view=null;tab="status";render();return}
    // ao criar conta, o link de confirmação já foi enviado
    if(pendingNome&&!u.emailVerified){perfilLoaded=true;render();return}
    await onAuthReady();
  });
  setInterval(()=>{if(tab==="status")softRender()},60000);
})();
